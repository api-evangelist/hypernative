dry_run_mode:
  supported: unknown
  note: >-
    Transaction Guard's whole premise is pre-signature transaction SIMULATION — the
    product simulates and evaluates a transaction before it is signed and broadcast, which
    is a dry-run capability at the product level. Whether the API exposes a caller-
    controlled dry-run/preview flag is not publicly documented.
reversibility:
  grade: undocumented
  applicable: true
  applicable_note: >-
    This is NOT a read-only API. Hypernative's automated-response surface takes consequential
    write actions — pausing protocols, blocking or rejecting transactions, freezing
    positions, and executing custom onchain response playbooks — alongside CRUD over
    watchlists, custom agents and notification channels. Reversibility therefore matters
    here more than for most APIs in this catalog, because the actions are both automated
    and onchain.
  reversal_operations: []
  window: null
  docs: null
  note: >-
    No reversal operation, undo path, or reversal window could be established from any
    public source. Hypernative publishes no OpenAPI, and its API reference is gated behind
    a customer login, so no operationId, cancel/rollback path or time window is readable.
    NO WINDOW IS ASSERTED HERE. Two structural observations are recorded instead, both
    from public material: (1) the onchain response actions Hypernative triggers are
    executed by CUSTOMER-OWNED contracts — e.g. Exactly Protocol's publicly documented
    Pauser contract at 0x8cC05394eD714073758E9bEf8073a83d79F6F2A3 — so the reversal path
    for a triggered pause is the customer's own contract role structure, not a Hypernative
    API endpoint; and (2) any onchain action, once mined, is irreversible in the ledger
    sense regardless of API affordances. A provider-published reversal/rollback reference
    is the single highest-value agent-readiness artifact Hypernative could add.
  graded_as: >-
    undocumented — no reversal path and no window found. Not `na`: a write surface
    demonstrably exists.
