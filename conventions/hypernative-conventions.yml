source: >-
  Live unauthenticated probes of https://api.hypernative.xyz (2026-08-22), the provider's
  status page, and public third-party integration source code. Hypernative's own API
  reference is a customer-only GitBook space (docs.hypernative.xyz 307s to an app login),
  so every "unknown" below is a genuine gap in what a member of the public can read — not
  an unchecked field.
