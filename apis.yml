  description: >-
    The Hypernative REST API exposes the platform's monitoring, detection, screening
    and automated-response surface — including Screener address reputation
    (/assets/reputation/addresses), asset and watchlist management, alert/notification
    channels and Transaction Guard policy enforcement. Authenticated with a Bearer
    token or client-id/client-secret pair issued from the Hypernative app. The
    reference documentation is published to customers via GitBook at
    docs.hypernative.xyz and requires an authenticated Hypernative account.
