api: Hypernative API
format: vendor-envelope
rfc9457: false
content_type: application/json; charset=utf-8
envelope:
  shape: |
    {
      "success": false,
      "data": {},
      "error": "<human-readable message>",
      "errorCode": <integer, mirrors the HTTP status>,
      "version": "<server build, e.g. 2.59.0+3f613ebbd>",
      "service": "<emitting service, e.g. @hypernative/server>"
    }
  fields:
  - name: success
    type: boolean
    note: false on every error; true on success (confirmed against /health).
  - name: data
    type: object
    note: Empty object on error; carries the payload on success.
  - name: error
    type: string
    note: Human-readable message. Not a stable machine identifier and not a URI.
  - name: errorCode
    type: integer
    note: >-
      Mirrors the HTTP status code in every response observed (404 -> 404, 401 -> 401).
      No finer-grained application error taxonomy was observable without credentials.
  - name: version
    type: string
    note: Server build stamp — useful for support correlation.
  - name: service
    type: string
    note: Names the emitting microservice (@hypernative/server observed).
  note: >-
    This is a vendor envelope, NOT RFC 9457 application/problem+json. There is no `type`
    URI, no `title`/`detail` split and no `instance`. An agent cannot resolve an error to
    a documented problem type.
