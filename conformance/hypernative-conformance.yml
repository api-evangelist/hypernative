domain_standards:
  market: onchain security, AML / sanctions screening and transaction risk for digital assets
  determinable: false
  note: >-
    REWARD-ONLY dimension, and it is correctly left unscored here. Hypernative's market
    does have candidate standards a contract could declare — OFAC SDN / sanctions list
    identifiers, FATF Travel Rule IVMS 101 payloads, and chain-level address formats such
    as CAIP-10 — and the product pages describe AML, sanctions and regulatory workflows
    aligned to OCC, FCA, MAS and MiCA supervisory expectations. But those are descriptions
    of what the PRODUCT does for customers, not a standard DECLARED BY A CONTRACT. With no
    published spec there is no schema URN, media type, message type or endpoint signature
    to point at, so no domain-standard conformance is asserted. This is a not-determinable,
    not a failure.
  candidates_not_verified:
